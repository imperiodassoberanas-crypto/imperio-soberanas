<!DOCTYPE html>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #fff8ef;
      background: #230910;
      min-height: 100vh;
      display: flex;

      height: 2px;

      margin: 20px auto;
    }
    p {
      font-size: 16px;
      line-height: 1.7;
      color: #f6e8e4;
    }
    .button {
      display: block;
      margin-top: 26px;
      padding: 17px 12px;
      background: #dfbd72;
      color: #35101a;
      text-decoration: none;
      font-weight: bold;
      border-radius: 12px;
      font-size: 16px;
    }
    .note {
      font-size: 12px;
      color: #e7cda0;
      margin-top: 20px;
    }
    footer {
      font-size: 11px;
      color: #c9a9a8;
